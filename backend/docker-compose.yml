services:
  db:
    image: postgres:15
    container_name: recetario_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d recetario_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: recetario_app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: recetario_db
      JWT_SECRET: supersecretkey123
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
